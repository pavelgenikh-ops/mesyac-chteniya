<style>
#stmark{position:fixed;right:12px;bottom:80px;width:72px;height:72px;z-index:2147483000;perspective:500px;
  border-radius:50%;cursor:grab;touch-action:none;user-select:none;opacity:.14;transform-origin:80% 80%;transition:opacity .35s,transform .35s}
#stmark:hover,#stmark.drag,#stmark.spin{opacity:1;transform:scale(1.45)}
#stmark.drag{cursor:grabbing}
#stmark .coin{position:absolute;inset:0;transform-style:preserve-3d}
#stmark img{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-user-drag:none;pointer-events:none;transform:translateZ(3px)}
#stmark img.back{transform:rotateY(180deg) translateZ(3px)}
#stmark .edge{position:absolute;left:50%;top:50%;width:3px;height:6px;margin:-3px 0 0 -1.5px;pointer-events:none}
@media print{#stmark{display:none}}
</style>
<script>
(function(){
  var el=document.getElementById('stmark'); if(!el) return; var coin=el.querySelector('.coin');
  // сплошное ребро как у покерной фишки: кольцо из 90 полосок по окружности (боковая стенка цилиндра)
  for(var i=0;i<90;i++){ var k=i%10, d=document.createElement('i'); d.className='edge';
    d.style.background=k<5?'#1E2E72':(k===5||k===9)?'#fff':'#DD127B';
    d.style.transform='rotateZ('+(i*4)+'deg) translateY(-34.7px) rotateX(90deg)'; coin.insertBefore(d,coin.firstChild); }
  if(el.parentNode!==document.body) document.addEventListener('DOMContentLoaded',function(){ document.body.appendChild(el); });
  var rx=0, ry=0, vx=0, vy=0, drag=false, px=0, py=0, raf=0;
  function draw(){ coin.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)'; }
  function tick(){ if(drag) return; vx*=0.95; vy*=0.95; ry+=vx; rx+=vy; draw();
    if(Math.abs(vx)+Math.abs(vy)>0.05){ raf=requestAnimationFrame(tick); } else { el.classList.remove('spin'); } }
  function reset(){ cancelAnimationFrame(raf); vx=vy=0; el.classList.remove('spin');
    rx=((rx%360)+540)%360-180; ry=((ry%360)+540)%360-180; draw();
    setTimeout(function(){ coin.style.transition='transform .6s ease-out'; rx=ry=0; draw();
      setTimeout(function(){ coin.style.transition=''; },620); },20); }
  el.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation(); drag=true; px=e.clientX; py=e.clientY; vx=vy=0;
    cancelAnimationFrame(raf); el.classList.add('drag'); try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener('pointermove',function(e){ if(!drag) return; var dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
    vx=dx*0.9; vy=-dy*0.9; ry+=vx; rx+=vy; draw(); });
  function up(e){ if(!drag) return; drag=false; el.classList.remove('drag');
    var r=el.getBoundingClientRect(), inside=e && e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
    if(inside){ el.classList.add('spin'); tick(); } else { reset(); } }
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  el.addEventListener('pointerleave',function(){ if(!drag) reset(); });
  el.addEventListener('dblclick',function(e){ e.stopPropagation(); reset(); });
  ['click','wheel','mousedown'].forEach(function(t){ el.addEventListener(t,function(e){ e.stopPropagation(); },{passive:true}); });
})();
</script>
